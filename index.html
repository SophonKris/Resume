<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份验证</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>身份验证</h1>
                <p class="auth-subtitle">请输入本人中文名验证</p>
            </div>

            <div class="auth-form">
                <div class="input-group">
                    <input type="text" id="nameInput" placeholder="请输入中文姓名" maxlength="10" autocomplete="off">
                    <button id="verifyBtn" class="verify-btn">验证</button>
                </div>

                <div class="attempt-info">
                    <span id="attemptCount">剩余尝试次数：2</span>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </div>

            <div class="auth-footer">
                <p>本网站均为本人使用 AI 辅助生成，仅用于个人用途。</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
